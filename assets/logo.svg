<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="neonPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
  </defs>

  <!-- Background Card -->
  <rect width="128" height="128" rx="28" fill="url(#bgGrad)" />
  <rect x="2" y="2" width="124" height="124" rx="26" fill="none" stroke="#334155" stroke-width="2" />

  <!-- Pixel Grid Floor lines -->
  <line x1="20" y1="96" x2="108" y2="96" stroke="#1e293b" stroke-width="2" />
  <line x1="28" y1="104" x2="100" y2="104" stroke="#1e293b" stroke-width="1.5" />

  <!-- Studio Desk (Isometric 2D) -->
  <rect x="36" y="74" width="56" height="6" rx="2" fill="#334155" />
  <rect x="42" y="80" width="4" height="16" rx="1" fill="#1e293b" />
  <rect x="82" y="80" width="4" height="16" rx="1" fill="#1e293b" />

  <!-- Dual Glowing Monitors -->
  <rect x="42" y="52" width="22" height="18" rx="2" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
  <rect x="45" y="55" width="16" height="12" fill="#0284c7" fill-opacity="0.25" />
  <line x1="47" y1="58" x2="55" y2="58" stroke="#38bdf8" stroke-width="1" stroke-linecap="round" />
  <line x1="47" y1="61" x2="58" y2="61" stroke="#38bdf8" stroke-width="1" stroke-linecap="round" />
  <line x1="47" y1="64" x2="52" y2="64" stroke="#38bdf8" stroke-width="1" stroke-linecap="round" />

  <rect x="66" y="52" width="20" height="18" rx="2" fill="#0f172a" stroke="#c084fc" stroke-width="1.5" />
  <rect x="69" y="55" width="14" height="12" fill="#9333ea" fill-opacity="0.25" />
  <line x1="71" y1="58" x2="79" y2="58" stroke="#c084fc" stroke-width="1" stroke-linecap="round" />
  <line x1="71" y1="61" x2="77" y2="61" stroke="#c084fc" stroke-width="1" stroke-linecap="round" />

  <!-- Agent Character Mascot -->
  <!-- Body/Torso -->
  <rect x="56" y="38" width="16" height="14" rx="4" fill="url(#neonPurple)" />
  <!-- Head -->
  <rect x="54" y="22" width="20" height="16" rx="5" fill="#fde047" />
  <!-- Eyes -->
  <rect x="58" y="27" width="3" height="4" rx="1" fill="#0f172a" />
  <rect x="67" y="27" width="3" height="4" rx="1" fill="#0f172a" />
  <!-- VR / Telemetry Visor -->
  <rect x="53" y="25" width="22" height="6" rx="2" fill="url(#neonCyan)" fill-opacity="0.75" />

  <!-- Coffee Mug on Desk -->
  <rect x="94" y="68" width="6" height="7" rx="1" fill="#f8fafc" />
  <path d="M100 70 Q102 71.5 100 73" stroke="#f8fafc" stroke-width="1" fill="none" />
  <path d="M96 66 Q97 64 96 62" stroke="#94a3b8" stroke-width="0.8" fill="none" stroke-linecap="round" />

  <!-- Live Pulse Dot -->
  <circle cx="106" cy="22" r="4" fill="#22c55e" />
  <circle cx="106" cy="22" r="7" fill="none" stroke="#22c55e" stroke-width="1.2" opacity="0.6">
    <animate attributeName="r" values="4;9;4" dur="2s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.8;0;0.8" dur="2s" repeatCount="indefinite" />
  </circle>
</svg>
