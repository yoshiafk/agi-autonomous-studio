<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- Background Obsidian Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1a103c" />
    </linearGradient>

    <!-- Orbital Ring Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Left Facet Gradient -->
    <linearGradient id="leftFacetGrad" x1="50%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Right Facet Gradient -->
    <linearGradient id="rightFacetGrad" x1="50%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>

    <!-- Telemetry Core Glow -->
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#34d399" />
      <stop offset="70%" stop-color="#10b981" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Squircle Base -->
  <rect width="256" height="256" rx="58" fill="url(#bgGrad)" />
  <rect x="2" y="2" width="252" height="252" rx="56" fill="none" stroke="#475569" stroke-width="1.8" stroke-opacity="0.6" />

  <!-- Ambient Backglow -->
  <circle cx="128" cy="130" r="75" fill="#06b6d4" opacity="0.15" />
  <circle cx="128" cy="130" r="45" fill="#10b981" opacity="0.25" />

  <!-- Back Half of Tilted Orbital Ring -->
  <g transform="rotate(14 128 146)">
    <path d="M 34 146 A 94 28 0 0 1 222 146" fill="none" stroke="url(#ringGrad)" stroke-width="8.5" stroke-linecap="round" opacity="0.7" />
  </g>

  <!-- The Graviton Delta (Main Prism) -->
  <!-- Left Facet -->
  <polygon points="128,42 54,180 128,138" fill="url(#leftFacetGrad)" />
  <!-- Right Facet -->
  <polygon points="128,42 128,138 202,180" fill="url(#rightFacetGrad)" />
  <!-- Center Ridge Highlight -->
  <line x1="128" y1="42" x2="128" y2="138" stroke="#ffffff" stroke-width="2.5" stroke-opacity="0.85" stroke-linecap="round" />

  <!-- Front Half of Tilted Orbital Ring -->
  <g transform="rotate(14 128 146)">
    <path d="M 34 146 A 94 28 0 0 0 222 146" fill="none" stroke="url(#ringGrad)" stroke-width="8.5" stroke-linecap="round" />
  </g>

  <!-- Telemetry Heartbeat Core -->
  <circle cx="128" cy="120" r="22" fill="none" stroke="#22c55e" stroke-width="1.5" opacity="0.4" />
  <circle cx="128" cy="120" r="14" fill="url(#coreGlow)" />
  <circle cx="128" cy="120" r="4" fill="#ffffff" />

  <!-- Antigravity Levitation Base Emitter Beams -->
  <line x1="86" y1="204" x2="170" y2="204" stroke="#06b6d4" stroke-width="3.5" stroke-linecap="round" opacity="0.8" />
  <line x1="104" y1="214" x2="152" y2="214" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round" opacity="0.6" />
  <line x1="118" y1="222" x2="138" y2="222" stroke="#8b5cf6" stroke-width="2.0" stroke-linecap="round" opacity="0.4" />
</svg>
